[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedflow"
version = "0.1.0"
description = "Privacy-preserving pedestrian flow analysis tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "pedpy>=1.4,<2",
    "opencv-contrib-python>=4.11,<5",
    "matplotlib>=3.9,<4",
    "panel>=1.7,<2",
    "holoviews>=1.20,<2",
    "hvplot>=0.11,<1",
    "pyviz-comms>=3.0,<4",
    "pyserial>=3.5,<4",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
include = ["pedflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/capture_serial.py" = ["E402"]
"scripts/capture_wifi.py" = ["E402"]
"scripts/generate_charuco_board.py" = ["E402"]
