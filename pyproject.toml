[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedflow"
version = "0.1.0"
description = "Privacy-preserving pedestrian flow analysis tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pedpy",
    "opencv-contrib-python",
    "matplotlib",
    "panel",
    "holoviews",
    "hvplot",
    "pyviz-comms",
    "pyserial",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["pedflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_charuco_board.py" = ["E402"]
